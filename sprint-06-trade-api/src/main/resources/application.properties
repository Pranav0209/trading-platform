spring.application.name=trading
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.sql.init.mode=always
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.zkuba.trading.domain.entity
mybatis.type-handlers-package=com.zkuba.trading.config
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-generated-keys=true
mybatis.configuration.default-executor-type=REUSE
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
trading.default-initial-balance=${DEFAULT_INITIAL_BALANCE:10000.00}
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.zkuba.trading=${APP_LOG_LEVEL:DEBUG}
logging.level.com.zkuba.trading.aop=DEBUG

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# Logging to file
logging.file.name=logs/trading-api.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
