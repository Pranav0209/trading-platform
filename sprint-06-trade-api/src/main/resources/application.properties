spring.application.name=trading
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/trading}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres1}
spring.sql.init.mode=always
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.zkuba.trading.domain.entity
mybatis.type-handlers-package=com.zkuba.trading.config
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-generated-keys=true
mybatis.configuration.default-executor-type=REUSE
jwt.secret=${JWT_SECRET:change-me-to-a-secret-that-is-at-least-32-characters-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
trading.default-initial-balance=${DEFAULT_INITIAL_BALANCE:10000.00}
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.zkuba.trading=${APP_LOG_LEVEL:DEBUG}
logging.level.com.zkuba.trading.aop=DEBUG
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

