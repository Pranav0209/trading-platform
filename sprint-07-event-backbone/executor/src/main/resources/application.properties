spring.application.name=trade-executor
server.port=8082

# Database configuration (matching sprint-06)
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:trading}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Kafka Consumer configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=trade-executor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka Producer configuration (for trade-events)
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Fauxnance API configuration
fauxnance.api.base-url=${FAUXNANCE_BASE_URL:https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1}
fauxnance.api.key=${FAUXNANCE_API_KEY:}

# Poller configuration
poll.interval.seconds=${POLL_INTERVAL_SECONDS:60}

# Jackson configuration
spring.jackson.deserialization.fail-on-unknown-properties=false
