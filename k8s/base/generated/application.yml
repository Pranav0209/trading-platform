# ==============================================================================
# Centralized Shared Application Configuration
# Mounted at /config/application.yml (SHARED_CONFIG)
# Placeholders align with environment variables in config.env and secrets.env
# ==============================================================================

# Application Environment
environment: ${NODE_ENV:development}

# Frontend Application
frontend:
  url: ${FRONTEND_URL:http://frontend}
  port: ${FRONTEND_PORT:80}

# Microservices Configuration
services:
  auth:
    url: ${AUTH_SERVICE_URL:http://auth-service:3000}
    port: ${AUTH_SERVICE_PORT:3000}
    name: auth-service
  order:
    url: ${ORDER_SERVICE_URL:http://order-service:8081}
    port: ${ORDER_SERVICE_PORT:8081}
    name: order-service
  executor:
    url: ${EXECUTOR_SERVICE_URL:http://executor-service:8082}
    port: ${EXECUTOR_SERVICE_PORT:8082}
    name: executor-service

# Database Configuration (AWS RDS PostgreSQL)
database:
  type: postgresql
  host: ${DB_HOST}
  port: ${DB_PORT:5432}
  name: ${DB_NAME:postgres}
  user: ${DB_USER:postgres}
  username: ${DATABASE_USERNAME:postgres}
  password: ${DB_PASSWORD}
  url: ${DATABASE_URL}
  spring_datasource_url: ${SPRING_DATASOURCE_URL}

# Kafka Configuration
kafka:
  host: kafka
  port: 29092
  bootstrap_servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
  brokers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

# JWT & Application Security
jwt:
  secret: ${JWT_SECRET}
  token_expiry: ${JWT_TOKEN_EXPIRY:15m}
  refresh_token_expiry_days: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:7}
  access_token_expires_in_seconds: ${ACCESS_TOKEN_EXPIRES_IN_SECONDS:900}

# CORS Configuration
cors:
  origins: ${CORS_ORIGINS:*}
  allowed_origins: ${CORS_ALLOWED_ORIGINS:*}

# Third-party APIs (Market Data & Exchange Rates)
fauxnance:
  base_url: ${FAUXNANCE_BASE_URL:https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1}
  api_key: ${FAUXNANCE_API_KEY}

frankfurter:
  base_url: ${FRANKFURTER_BASE_URL:https://api.frankfurter.dev}

poller:
  interval_seconds: ${POLL_INTERVAL_SECONDS:3600}

# EmailJS Notifications
emailjs:
  service_id: ${EMAILJS_SERVICE_ID}
  template_id: ${EMAILJS_TEMPLATE_ID}
  public_key: ${EMAILJS_PUBLIC_KEY}
  private_key: ${EMAILJS_PRIVATE_KEY}
  api_url: ${EMAILJS_API_URL:https://api.emailjs.com/api/v1.0/email/send}

# Logging Configuration
logging:
  level: ${LOG_LEVEL:INFO}
  app_level: ${APP_LOG_LEVEL:DEBUG}
