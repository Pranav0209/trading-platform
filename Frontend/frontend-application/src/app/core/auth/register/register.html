<div class="login-page" role="main" aria-labelledby="register-heading">
  <!-- Left Side: Branding -->
  <div class="login-brand">
    <div class="brand-content">
      <div class="logo">
        <div class="logo-icon" aria-hidden="true">Z</div>
        <div class="logo-text">Zkuba Trading</div>
      </div>
      <div class="brand-copy">
        <h1>Trade Smarter</h1>
        <p>
          Create your account to access global markets, advanced analytics, and secure execution.
        </p>
      </div>
    </div>
  </div>

  <!-- Right Side: Login -->
  <div class="login-section">
    <div class="login-card">
      <h2 id="register-heading">Sign Up</h2>
      <p class="login-subtitle">Create a new trading account.</p>

      @if (errorMessage()) {
        <div class="error-message" data-testid="error-message" role="alert" aria-live="assertive">{{ errorMessage() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" aria-describedby="register-heading">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            id="username"
            type="text"
            formControlName="username"
            data-testid="username-input"
            placeholder="Choose a username"
            autocomplete="username"
            aria-required="true"
          />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            data-testid="email-input"
            placeholder="Enter your email address"
            autocomplete="email"
            aria-required="true"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            data-testid="password-input"
            placeholder="Create a password (min 8 chars)"
            autocomplete="new-password"
            aria-required="true"
          />
        </div>

        <button
          type="submit"
          class="login-button"
          [disabled]="form.invalid"
          data-testid="submit-button"
        >
          Create Account
        </button>
      </form>

      <div class="register-text">Already have an account? <a routerLink="/sign-in">Sign in</a></div>
    </div>
  </div>
</div>
