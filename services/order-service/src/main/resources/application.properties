spring.application.name=trading
spring.config.import=optional:file:${COMMON_CONFIG_PATH:../../Config/application.yml},optional:file:.env[.properties]
server.port=${SERVER_PORT:${services.order.port}}
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.zkuba.trading.domain.entity
mybatis.type-handlers-package=com.zkuba.trading.config
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-generated-keys=true
mybatis.configuration.default-executor-type=REUSE
jwt.secret=${JWT_SECRET}

logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.zkuba.trading=${APP_LOG_LEVEL}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:${kafka.host}:${kafka.port}}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# Logging to file
logging.file.name=logs/trading-api.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# EmailJS
emailjs.service-id=${EMAILJS_SERVICE_ID}
emailjs.template-id=${EMAILJS_TEMPLATE_ID}
emailjs.public-key=${EMAILJS_PUBLIC_KEY}
emailjs.private-key=${EMAILJS_PRIVATE_KEY}

# Fauxnance
fauxnance.api.base-url=${FAUXNANCE_BASE_URL}
fauxnance.api.key=${FAUXNANCE_API_KEY}
spring.jpa.open-in-view=false
