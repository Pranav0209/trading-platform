spring.application.name=trade-executor
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT}

# Database configuration (matching trade-api)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Kafka Consumer configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=trade-executor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka Producer configuration (for trade-events)
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Fauxnance API configuration
fauxnance.api.base-url=${FAUXNANCE_BASE_URL}
fauxnance.api.key=${FAUXNANCE_API_KEY}

# Poller configuration
poll.interval.seconds=${POLL_INTERVAL_SECONDS:300}

# Jackson configuration
spring.jackson.deserialization.fail-on-unknown-properties=false

# Frankfurter API configuration
frankfurter.api.base-url=${FRANKFURTER_BASE_URL:https://api.frankfurter.dev}

# Internal order placement
order.service.base-url=${ORDER_SERVICE_BASE_URL}
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:change-me-to-a-secret-that-is-at-least-32-characters-long}
